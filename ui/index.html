<!DOCTYPE html>
<html>
<head>
    <title>University Courses RAG System</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="js/script.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav>
        <div onclick="handleMenuOpen()" class="ham-menu">
            <span></span><span></span><span></span>
        </div>
        <div>Old conversation 1</div>
        <div class="new-chat">+</div>
    </nav>

    <div id="main">
        <div id="sidenav">
            <div class="sidenav-content">
                <button id="close" onclick="handleMenuClose()"><span></span></button>
                <button id="new-chat-btn">+ New chat</button>
                <div class="saved-chats">
                    <p class="selected">Old conversation 1</p>
                    <p>Old conversation 2</p>
                </div>
                <div class="config">
                    <hr />
                    <p>Clear conversations</p>
                    <p>Dark mode</p>
                    <p>Update & FAQs</p>
                    <p>Log out</p>
                </div>
            </div>
        </div>

        <div id="content-body">
            <div id="messages">
                <!-- Messages will be dynamically inserted here -->
            </div>

            <div id="chat-section">
                <div>
                    <input type="text" placeholder="Ask a question about your university courses..." />
                </div>
            </div>
        </div>
    </div>
</body>
</html>
